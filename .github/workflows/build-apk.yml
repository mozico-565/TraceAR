name: Build TraceAR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TraceAR-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TraceAR-debug
          path: TraceAR-1.0.0-debug.apk
          if-no-files-found: error
      - name: Publish first version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 TraceAR-1.0.0-debug.apk --clobber
          else
            gh release create v1.0.0 TraceAR-1.0.0-debug.apk --target "$GITHUB_SHA" --title "TraceAR 1.0.0" --notes "Native ARCore tracing. Build and unit tests verified by CI; physical ARCore device validation pending. Debug-signed APK."
          fi
