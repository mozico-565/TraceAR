name: Build TraceAR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM for tracker integration tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native visual tracking on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TraceAR-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/reports/lint-results-debug.html
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TraceAR-1.1.1-debug.apk
          python - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('TraceAR-1.1.1-debug.apk') as apk:
              entries = apk.namelist()
              for abi in ('armeabi-v7a', 'arm64-v8a'):
                  assert any(p.startswith('lib/' + abi + '/') and 'opencv' in p for p in entries), abi + ' OpenCV library missing'
              assert 'AndroidManifest.xml' in entries
          print('APK verified: ARM 32-bit and 64-bit OpenCV libraries present')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: TraceAR-debug
          path: TraceAR-1.1.1-debug.apk
          if-no-files-found: error
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release upload v1.1.1 TraceAR-1.1.1-debug.apk --clobber
          else
            gh release create v1.1.1 TraceAR-1.1.1-debug.apk --target "$GITHUB_SHA" --title "TraceAR 1.1.1" --notes "ARCore plus local CameraX/OpenCV planar tracking fallback. Build, math tests, lint and synthetic native tracking plus camera lifecycle tests on an emulator verified by CI. Galaxy A12 and ARCore physical device validation pending. Debug-signed APK."
          fi
