        run: |
          python - <<'PYCODE'
          import os,base64,io,zipfile
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['SOURCE_ZIP']))) as archive:
              archive.extractall('.')
          PYCODE
          git config user.name "mozico-565"
          git config user.email "mozico-565@users.noreply.github.com"
          git add --all -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m "Add local visual surface tracking fallback with CameraX and OpenCV"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assembleDebug --stacktrace
      - name: Enable KVM for tracker integration tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native visual tracking on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TraceAR-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/reports/lint-results-debug.html
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TraceAR-1.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TraceAR-debug
          path: TraceAR-1.1.0-debug.apk
          if-no-files-found: error
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 TraceAR-1.1.0-debug.apk --clobber
          else
            gh release create v1.1.0 TraceAR-1.1.0-debug.apk --target "$GITHUB_SHA" --title "TraceAR 1.1.0" --notes "ARCore plus local CameraX/OpenCV planar tracking fallback. Build, math tests and lint verified by CI. Galaxy A12 and ARCore physical device validation pending. Debug-signed APK."
          fi
